name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run advertised demo from a fresh clone of the tested revision
        shell: bash
        run: |
          set -euo pipefail
          # Clone the checked-out PR/push revision, not a potentially older main.
          git clone --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/minority-prophet"
          cd "$RUNNER_TEMP/minority-prophet"
          make demo DEMO_PYTHON=python 2>&1 | tee "$RUNNER_TEMP/demo-output.txt"
      - name: Preserve dated demo receipt (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-output-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/demo-output.txt
          if-no-files-found: error

  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select trusted comparison base
        id: comparison
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi
      - name: Check newly added public material
        env:
          # Terms too sensitive to name in the public blocklist, supplied as
          # SHA-256 digests computed on the owner's machine by
          # scripts/add_boundary_term.py. The plaintext reaches no file, no git
          # history, no shell history and no transcript; and because the digest
          # lives in a secret rather than in the checker, it cannot be attacked
          # with a wordlist either. Absent secret = empty string = no extra terms.
          # It propagates through make to the checker.
          MP_BOUNDARY_DIGESTS: ${{ secrets.MP_BOUNDARY_DIGESTS }}
        run: make check-public-boundary BASE="${{ steps.comparison.outputs.base }}" HEAD_REF="${{ github.sha }}" PYTHON=python
      - name: Sweep every tracked line, not only additions
        # The step above inspects additions only, by design, so frozen records are
        # never rewritten. The cost is that a term added to the blocklist today is
        # never applied to anything committed yesterday -- which is how an
        # owner-designated never-public term outlived the rule that blocks it. This
        # step reconciles the whole published tree against the current rules.
        env:
          MP_BOUNDARY_DIGESTS: ${{ secrets.MP_BOUNDARY_DIGESTS }}
        run: make check-public-boundary-sweep HEAD_REF="${{ github.sha }}" PYTHON=python
      - name: Check no live commission's withheld values are published
        run: make check-withheld-leak BASE="${{ steps.comparison.outputs.base }}" HEAD_REF="${{ github.sha }}" PYTHON=python
      - name: Verify preregistrations still match their pinned commits
        run: make check-registration-chain HEAD_REF="${{ github.sha }}" PYTHON=python
      - name: Check graduated research integrity
        run: make check-research-integrity BASE="${{ steps.comparison.outputs.base }}" HEAD_REF="${{ github.sha }}" PYTHON=python
      - name: Reconcile canonical evidence model
        run: make check-canonical-model PYTHON=python

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: make verify-python PYTHON=python

  ietf-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest
      - run: make ietf-check BOOTSTRAP_PYTHON=python PYTHON=python

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make verify-site

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make verify-evaluation

  runtime-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject dependency advisories
        run: python scripts/check_npm_audit.py
      - name: Build unpublished runtime archive, checksum, evidence, and SBOM
        run: npm --prefix evaluations/multi-model-v1 run pack:evidence
