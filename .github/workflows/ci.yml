name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select trusted comparison base
        id: comparison
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Check newly added public material
        run: make check-public-boundary BASE="${{ steps.comparison.outputs.base }}" HEAD_REF="${{ github.sha }}" PYTHON=python
      - name: Check no live commission's withheld values are published
        run: make check-withheld-leak BASE="${{ steps.comparison.outputs.base }}" HEAD_REF="${{ github.sha }}" PYTHON=python
      - name: Verify preregistrations still match their pinned commits
        run: make check-registration-chain HEAD_REF="${{ github.sha }}" PYTHON=python
      - name: Check graduated research integrity
        run: make check-research-integrity BASE="${{ steps.comparison.outputs.base }}" HEAD_REF="${{ github.sha }}" PYTHON=python

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: make verify-python PYTHON=python

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make verify-site
